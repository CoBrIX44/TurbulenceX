[project]
name = "domino-sky-backend"
version = "1.0.0"
requires-python = ">=3.11"
# Runtime dependencies. Vercel's uv-based installer reads THIS list (not requirements.txt)
# whenever a pyproject.toml is present — keep it in sync with requirements.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*httpx.*",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP045", "E501", "B905", "B007", "UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.vercel]
entrypoint = "main.py"
